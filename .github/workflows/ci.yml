name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet / build / test (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: indexcore
          POSTGRES_PASSWORD: indexcore
          POSTGRES_DB: indexcore
        ports:
          - 5432:5432
        # Disposable CI-only credentials; never used outside this job.
        options: >-
          --health-cmd "pg_isready -U indexcore -d indexcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/indexcore?sslmode=disable
      INDEXCORE_ISSUE130_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/indexcore_issue130_test?sslmode=disable
      INDEXCORE_ISSUE130_DISPOSABLE: owned-disposable-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Provision separate purpose-marked Issue130 database
        env:
          PGPASSWORD: indexcore
        run: |
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE indexcore_issue130_test OWNER indexcore'
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE indexcore_issue130_test IS 'indexcore-issue130-owned-disposable'"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Full PostgreSQL 18 test suite
        run: go test -p 1 -count=1 ./...

      - name: Targeted race suite (hybrid runtime + app lifecycle)
        run: go test -race -count=1 ./internal/runtime/incrementalruntime ./internal/runtime/app

      - name: P0-R2 adversarial matrix race (PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestP0R2' ./internal/runtime/scan ./internal/store/postgres

      - name: P0-R3 read-only diagnostics race (PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestP0R3' ./internal/diagnostic ./internal/store/postgres ./internal/runtime/app ./cmd/indexcore

      - name: Issue130 terminal handoff race (owned PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestIssue130' ./testutil ./internal/store/postgres ./internal/runtime/scan
