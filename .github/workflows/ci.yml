name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet / build / test (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: indexcore
          POSTGRES_PASSWORD: indexcore
          POSTGRES_DB: indexcore
        ports:
          - 5432:5432
        # Disposable CI-only credentials; never used outside this job.
        options: >-
          --health-cmd "pg_isready -U indexcore -d indexcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/indexcore?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Full PostgreSQL 18 test suite
        run: go test -p 1 -count=1 ./...

      - name: Targeted race suite (hybrid runtime + app lifecycle)
        run: go test -race -count=1 ./internal/runtime/incrementalruntime ./internal/runtime/app

      - name: P0-R2 adversarial matrix race (PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestP0R2' ./internal/runtime/scan ./internal/store/postgres

      - name: P0-R3 read-only diagnostics race (PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestP0R3' ./internal/diagnostic ./internal/store/postgres ./internal/runtime/app ./cmd/indexcore

  r4-smoke:
    name: P0-R4 guarded nested correctness smoke / race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline command identity, redaction and optimization guard regressions
        run: python3 -m unittest discover -s scripts/p0-r4 -p test_runner.py -v
      - name: Prepare owned isolated PostgreSQL 18 (no published ports)
        run: python3 scripts/p0-r4/run-isolated.py prepare --workspace /tmp/indexcore-r4-125-ci
      - name: Compile guarded R4 race binary
        run: python3 scripts/p0-r4/run-isolated.py compile --workspace /tmp/indexcore-r4-125-ci --race
      - name: Bounded 200-resource nested correctness smoke under race detector
        run: python3 scripts/p0-r4/run-isolated.py smoke --workspace /tmp/indexcore-r4-125-ci --ci-smoke --race
      - name: Stop only owned database (retain evidence)
        if: always()
        run: |
          if test -f /tmp/indexcore-r4-125-ci/attestation.json; then
            python3 scripts/p0-r4/run-isolated.py stop --workspace /tmp/indexcore-r4-125-ci
          fi
      - name: Upload redacted bounded smoke receipts, not data or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-r4-bounded-smoke
          path: |
            /tmp/indexcore-r4-125-ci/*-result.json
            /tmp/indexcore-r4-125-ci/*.log
          if-no-files-found: ignore
