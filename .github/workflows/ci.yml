name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet / build / test (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: indexcore
          POSTGRES_PASSWORD: indexcore
          POSTGRES_DB: indexcore
        ports:
          - 5432:5432
        # Disposable CI-only credentials; never used outside this job.
        options: >-
          --health-cmd "pg_isready -U indexcore -d indexcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/indexcore?sslmode=disable
      INDEXCORE_ISSUE130_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/indexcore_issue130_test?sslmode=disable
      INDEXCORE_ISSUE130_DISPOSABLE: owned-disposable-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Provision separate purpose-marked Issue130 database
        env:
          PGPASSWORD: indexcore
        run: |
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE indexcore_issue130_test OWNER indexcore'
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE indexcore_issue130_test IS 'indexcore-issue130-owned-disposable'"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Full PostgreSQL 18 test suite
        run: go test -p 1 -count=1 ./...

      - name: Targeted race suite (hybrid runtime + app lifecycle)
        run: go test -race -count=1 ./internal/runtime/incrementalruntime ./internal/runtime/app

      - name: P0-R2 adversarial matrix race (PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestP0R2' ./internal/runtime/scan ./internal/store/postgres

      - name: P0-R3 read-only diagnostics race (PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestP0R3' ./internal/diagnostic ./internal/store/postgres ./internal/runtime/app ./cmd/indexcore

      - name: Issue130 terminal handoff race (owned PostgreSQL 18)
        run: go test -race -p 1 -count=1 -run '^TestIssue130' ./testutil ./internal/store/postgres ./internal/runtime/scan

      - name: Issue134 F1/F2 race and backend crash (owned PostgreSQL 18)
        env:
          PGPASSWORD: indexcore
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index134_test?sslmode=disable
          INDEXCORE_ISSUE134_DISPOSABLE: owned-disposable-only
        run: |
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE index134_test OWNER indexcore'
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE index134_test IS 'indexcore-issue134-owned-disposable'"
          go test -race -p 1 -count=3 -run '^TestIssue134|^TestDiscoveryCompletionAtomicRollbackAndStaleClaim$' ./internal/runtime/config ./internal/store/postgres ./internal/runtime/incrementalexec ./internal/runtime/incrementalorch ./internal/runtime/app

      - name: Issue134 F2 nested 2k and real-time 400 latency (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index134_test?sslmode=disable
          INDEXCORE_ISSUE134_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE134_F2_SCALE: '2000'
          INDEXCORE_ISSUE134_F2_PERF: '1'
        run: go test -race -p 1 -count=1 -run '^TestIssue134Mirror2kNestedFixture$|^TestIssue134Mirror400RealLatency$' ./internal/runtime/incrementalexec

      - name: Issue134 F3 bounded capacity investigation (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index134_test?sslmode=disable
          INDEXCORE_ISSUE134_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE134_F3_SCALE: '2000'
        run: go test -race -p 1 -count=1 -timeout=10m -run '^TestIssue134F3' ./internal/runtime/incrementalexec

      - name: Issue138 bounded fetch seam and serial commit fences (owned PostgreSQL 18)
        env:
          PGPASSWORD: indexcore
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
        run: |
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE index138_test OWNER indexcore'
          psql -h 127.0.0.1 -U indexcore -d postgres -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE index138_test IS 'indexcore-issue138-owned-disposable'"
          go test -race -p 1 -count=3 -timeout=3m -run '^TestIssue138' ./internal/runtime/scan ./internal/store/postgres

      - name: Issue138 2k eight-root delayed fetch proof (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE138_SCALE: '2000'
        run: go test -race -p 1 -count=1 -timeout=5m -run '^TestIssue138CapacityReadPrototype$' ./internal/runtime/scan

      - name: Issue138 same-root ordered sibling delayed proof (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE138_SAME_ROOT_POPULATION: '2000'
          INDEXCORE_ISSUE138_SAME_ROOT_FETCHES: '16'
        run: go test -race -p 1 -count=1 -timeout=5m -run '^TestIssue138SameRootCapacity$' ./internal/runtime/scan

      - name: Issue138 50k dependency query projection (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE138_DEPENDENCY_PLAN: '50000'
        run: go test -race -p 1 -count=1 -timeout=3m -run '^TestIssue138DependencyQueryPlan$' ./internal/store/postgres

      - name: Issue138 runtime pool policy, recovery and real OS crash (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
        run: go test -race -p 1 -count=3 -timeout=5m -run '^TestIssue138Pool|^TestIssue138Budget' ./internal/sourcebudget ./internal/runtime/config ./internal/runtime/app

      - name: Issue138 actual P10 runtime delayed-source proof (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE138_RUNTIME_FETCHES: '16'
        run: go test -race -p 1 -count=1 -timeout=5m -run '^TestIssue138PoolRuntimeLatency$' ./internal/runtime/app -v

      - name: Issue144 stale-head startup handoff and redacted diagnosis (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
        run: go test -race -p 1 -count=3 -timeout=3m -run '^TestIssue144' ./internal/runtime/app ./internal/runtime/incrementalruntime

      - name: Issue144 one-root 400-scope finite safety and FIFO proof (owned PostgreSQL 18)
        env:
          INDEXCORE_TEST_DATABASE_URL: postgres://indexcore:indexcore@127.0.0.1:5432/index138_test?sslmode=disable
          INDEXCORE_ISSUE138_DISPOSABLE: owned-disposable-only
          INDEXCORE_ISSUE144_BACKLOG: '400'
        run: go test -race -p 1 -count=1 -timeout=3m -run '^TestIssue144N1Backlog400$' ./internal/runtime/app -v
